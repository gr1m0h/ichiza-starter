name: 登壇者情報
description: connpass 掲載用の登壇者情報をご記入ください
title: "[speaker] "
labels: [speakers]
body:
  - type: input
    id: handle
    attributes: { label: お名前（ハンドルネーム可） }
    validations: { required: true }
  - type: input
    id: sns
    attributes: { label: SNS の URL（X、GitHub など。任意） }
  - type: textarea
    id: bio
    attributes: { label: 簡単な経歴・プロフィール（2〜3行程度） }
    validations: { required: true }
  - type: input
    id: session_title
    attributes: { label: セッションタイトル（仮で OK、後から変更可） }
    validations: { required: true }
  - type: checkboxes
    id: remote
    attributes:
      label: 登壇形態
      options:
        - label: リモート登壇を希望（配信用の参加リンクをお送りします）
