name: ichiza remind
on:
  schedule:
    - cron: "0 0 * * *" # 09:00 JST
  workflow_dispatch: {}
permissions:
  contents: read
  issues: read
jobs:
  remind:
    # Skip the daily cron on the template repo itself (manual runs still work).
    # Repos created from the template have a different name, so this passes there.
    if: github.event_name == 'workflow_dispatch' || github.repository != 'gr1m0h/ichiza-starter'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check SLACK_WEBHOOK_URL
        id: slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::SLACK_WEBHOOK_URL secret is not set — skipping remind"
          fi
      - uses: gr1m0h/ichiza/actions/remind@v0.2.1
        if: steps.slack.outputs.present == 'true'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
