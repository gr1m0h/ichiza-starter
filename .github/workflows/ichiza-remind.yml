name: ichiza remind
on:
  schedule:
    - cron: "0 0 * * *" # 09:00 JST
  workflow_dispatch: {}
permissions:
  contents: read
  issues: read
jobs:
  remind:
    # Skip the daily cron on the template repo itself (manual runs still work).
    # Repos created from the template have a different name, so this passes there.
    if: github.event_name == 'workflow_dispatch' || github.repository != 'gr1m0h/ichiza-starter'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gr1m0h/ichiza/actions/remind@v0
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
