name: ichiza web deploy
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: gr1m0h/ichiza/actions/setup@bb031b502e0113f47912bdf4aaa0435f7ba659bb
        with:
          version: v0.5.2-0.20261112032159-bb031b502e01
      - name: Build allowed operator list
        id: config
        run: |
          config=$(ichiza web-config)
          echo "members=$(jq -c .members <<<"$config")" >> "$GITHUB_OUTPUT"
          echo "timezone=$(jq -r .timezone <<<"$config")" >> "$GITHUB_OUTPUT"
      - uses: gr1m0h/ichiza/actions/web-deploy@bb031b502e0113f47912bdf4aaa0435f7ba659bb
        with:
          worker-name: ${{ vars.ICHIZA_WORKER_NAME }}
          members: ${{ steps.config.outputs.members }}
          timezone: ${{ steps.config.outputs.timezone }}
          access-team-domain: ${{ vars.CF_ACCESS_TEAM_DOMAIN }}
          access-aud: ${{ vars.CF_ACCESS_AUD }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          ICHIZA_GITHUB_TOKEN: ${{ secrets.ICHIZA_GITHUB_TOKEN }}
