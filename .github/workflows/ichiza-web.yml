name: ichiza web deploy
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: gr1m0h/ichiza/actions/setup@78884a1cb7257636db24bcbdf932d6797a912dd0
        with:
          version: v0.5.2-0.20261112031034-78884a1cb725
      - name: Build allowed operator list
        id: config
        run: |
          config=$(ichiza web-config)
          echo "members=$(jq -c .members <<<"$config")" >> "$GITHUB_OUTPUT"
          echo "timezone=$(jq -r .timezone <<<"$config")" >> "$GITHUB_OUTPUT"
      - uses: gr1m0h/ichiza/actions/web-deploy@78884a1cb7257636db24bcbdf932d6797a912dd0
        with:
          worker-name: ${{ vars.ICHIZA_WORKER_NAME }}
          members: ${{ steps.config.outputs.members }}
          timezone: ${{ steps.config.outputs.timezone }}
          access-team-domain: ${{ vars.CF_ACCESS_TEAM_DOMAIN }}
          access-aud: ${{ vars.CF_ACCESS_AUD }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          ICHIZA_GITHUB_TOKEN: ${{ secrets.ICHIZA_GITHUB_TOKEN }}
