# ichiza root config — all community-specific defaults live here.
# Full-featured example: https://github.com/gr1m0h/ichiza/tree/main/examples/meetup
lifecycle: templates/lifecycle.yaml
events_dir: events
defaults:
  mode: onsite # onsite | hybrid | online
  venue:
    capacity: 20
  roles: [organizer]
  streaming_role: streaming # appended to roles only when mode is hybrid/online
  # streaming: # streaming defaults, used only when mode is hybrid/online
  #   platform: streamyard # adjust to your streaming service
  #   camera: [smartphone]
  # timetable: # timetable skeleton copied into each new event.yaml
  #   - { start: "19:00", title: "オープニング" }
  #   - { start: "19:10", title: "セッション1", speaker: "" }
notifier:
  type: slack # notification adapter (currently slack only)
registry:
  type: connpass # event registry adapter (currently connpass only)
  templates: # page draft templates — edit these to your community's voice
    page: templates/registry/page.md
sns:
  x:
    mode: intent # X announcement mode (currently intent only: one-tap post links)
